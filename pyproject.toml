[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figures-framework"
version = "0.1.0"
description = "Reusable diagram and plot framework for presentations"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.optional-dependencies]
graphs = ["networkx>=3.0"]

[tool.setuptools]
packages = ["figures_framework"]
